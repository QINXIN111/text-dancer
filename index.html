<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字里跳舞的二次元</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  canvas {
    display: block;
  }
  #title {
    color: #ff6b9d;
    font-size: 14px;
    margin-top: 12px;
    letter-spacing: 4px;
    opacity: 0.7;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">♪ 舞い踊るテキスト ♪</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = canvas.width = 800;
const H = canvas.height = 600;

// Characters that will flow and dance
const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン♥★☆♪♫あいうえお0123456789';
const charArr = [...chars];

// Color palettes
const palettes = [
  ['#ff6b9d', '#c44dff', '#6b5bff', '#4dc9ff', '#4dff88'],
  ['#ff4d6a', '#ff6bff', '#6b8bff', '#4dfff5', '#b8ff4d'],
  ['#ff9a76', '#ff6f91', '#c471ed', '#6bb5ff', '#7de8b4'],
];

let time = 0;

// Particle class for text characters
class TextParticle {
  constructor(x, y, targetX, targetY, char, color, size) {
    this.x = x;
    this.y = y;
    this.targetX = targetX;
    this.targetY = targetY;
    this.char = char;
    this.color = color;
    this.size = size;
    this.vx = 0;
    this.vy = 0;
    this.phase = Math.random() * Math.PI * 2;
    this.speed = 0.5 + Math.random() * 1.5;
  }

  update(t) {
    // Spring toward target with dance wiggle
    const wiggleX = Math.sin(t * this.speed + this.phase) * 12;
    const wiggleY = Math.cos(t * this.speed * 1.3 + this.phase) * 8;
    const dx = (this.targetX + wiggleX) - this.x;
    const dy = (this.targetY + wiggleY) - this.y;
    this.vx += dx * 0.03;
    this.vy += dy * 0.03;
    this.vx *= 0.88;
    this.vy *= 0.88;
    this.x += this.vx;
    this.y += this.vy;
  }

  draw(ctx, t) {
    const alpha = 0.5 + 0.5 * Math.sin(t * 2 + this.phase);
    ctx.globalAlpha = 0.3 + alpha * 0.7;
    ctx.fillStyle = this.color;
    ctx.font = `bold ${this.size}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.char, this.x, this.y);
    ctx.globalAlpha = 1;
  }
}

// Define the dancing figure shape (body points)
function getDancingFigure(t) {
  const points = [];
  const cx = W / 2;
  const cy = H / 2;
  const bounce = Math.sin(t * 3) * 15;
  const sway = Math.sin(t * 2) * 10;
  const armAngle1 = Math.sin(t * 3.5) * 0.8;
  const armAngle2 = Math.cos(t * 3.5) * 0.8;
  const legAngle1 = Math.sin(t * 3) * 0.5;
  const legAngle2 = Math.cos(t * 3) * 0.5;

  // Head (circle)
  const headY = cy - 120 + bounce;
  for (let a = 0; a < Math.PI * 2; a += 0.15) {
    const r = 35;
    points.push({
      x: cx + sway + Math.cos(a) * r,
      y: headY + Math.sin(a) * r
    });
  }

  // Hair (flowing arcs)
  for (let i = 0; i < 12; i++) {
    const ha = -Math.PI * 0.8 + (i / 12) * Math.PI * 1.6;
    const hr = 40 + Math.sin(t * 2 + i) * 10;
    for (let j = 0; j < 5; j++) {
      points.push({
        x: cx + sway + Math.cos(ha) * (hr + j * 6) + Math.sin(t * 2 + j) * 5,
        y: headY + Math.sin(ha) * (hr + j * 6) - 5
      });
    }
  }

  // Neck
  for (let i = 0; i < 4; i++) {
    points.push({ x: cx + sway + Math.sin(t * 3) * 2, y: headY + 38 + i * 6 });
  }

  // Body / torso
  for (let i = 0; i < 15; i++) {
    const yy = headY + 60 + i * 7 + bounce * 0.5;
    const ww = 20 + Math.sin(i / 15 * Math.PI) * 15 + Math.sin(t * 2 + i * 0.3) * 3;
    for (let j = -2; j <= 2; j++) {
      points.push({ x: cx + sway + j * (ww / 2.5), y: yy });
    }
  }

  // Skirt (flaring out with animation)
  const skirtBase = headY + 165 + bounce * 0.5;
  for (let i = 0; i < 12; i++) {
    const ratio = i / 12;
    const sw = 25 + ratio * 50 + Math.sin(t * 3 + ratio * 4) * 10;
    for (let j = -3; j <= 3; j++) {
      points.push({
        x: cx + sway + j * (sw / 3.5),
        y: skirtBase + ratio * 60 + Math.sin(t * 4 + j) * ratio * 8
      });
    }
  }

  // Left arm
  const shoulderL = { x: cx + sway - 25, y: headY + 65 + bounce * 0.5 };
  for (let i = 0; i < 10; i++) {
    const r = i / 10;
    const angle = -Math.PI * 0.3 + armAngle1;
    points.push({
      x: shoulderL.x + Math.cos(angle) * r * 70,
      y: shoulderL.y + Math.sin(angle) * r * 70
    });
  }

  // Right arm
  const shoulderR = { x: cx + sway + 25, y: headY + 65 + bounce * 0.5 };
  for (let i = 0; i < 10; i++) {
    const r = i / 10;
    const angle = -Math.PI * 0.7 - armAngle2;
    points.push({
      x: shoulderR.x + Math.cos(angle) * r * 70,
      y: shoulderR.y + Math.sin(angle) * r * 70
    });
  }

  // Left leg
  const hipL = { x: cx + sway - 15, y: skirtBase + 55 };
  for (let i = 0; i < 12; i++) {
    const r = i / 12;
    points.push({
      x: hipL.x + Math.sin(legAngle1) * r * 60,
      y: hipL.y + r * 70 + Math.cos(legAngle1) * r * 20
    });
  }

  // Right leg
  const hipR = { x: cx + sway + 15, y: skirtBase + 55 };
  for (let i = 0; i < 12; i++) {
    const r = i / 12;
    points.push({
      x: hipR.x + Math.sin(-legAngle2) * r * 60,
      y: hipR.y + r * 70 + Math.cos(-legAngle2) * r * 20
    });
  }

  return points;
}

// Flowing background text field
let bgParticles = [];
function initBgParticles() {
  for (let i = 0; i < 600; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    bgParticles.push(new TextParticle(
      x, y, x, y,
      charArr[Math.floor(Math.random() * charArr.length)],
      palettes[0][Math.floor(Math.random() * palettes[0].length)],
      8 + Math.random() * 14
    ));
  }
}
initBgParticles();

// Particles that trace the figure
let figureParticles = [];

function updateFigureParticles(t) {
  const figPoints = getDancingFigure(t);
  // Add some jitter/spread
  while (figureParticles.length < figPoints.length * 3) {
    figureParticles.push(new TextParticle(
      W / 2 + (Math.random() - 0.5) * 400,
      H / 2 + (Math.random() - 0.5) * 400,
      W / 2, H / 2,
      charArr[Math.floor(Math.random() * charArr.length)],
      palettes[1][Math.floor(Math.random() * palettes[1].length)],
      10 + Math.random() * 10
    ));
  }

  for (let i = 0; i < figureParticles.length; i++) {
    const figIdx = i % figPoints.length;
    const p = figureParticles[i];
    p.targetX = figPoints[figIdx].x + (Math.random() - 0.5) * 8;
    p.targetY = figPoints[figIdx].y + (Math.random() - 0.5) * 8;
    // Occasionally swap character
    if (Math.random() < 0.005) {
      p.char = charArr[Math.floor(Math.random() * charArr.length)];
    }
    p.update(t);
  }
}

// Musical notes floating around
let notes = [];
function spawnNote(t) {
  if (Math.random() < 0.03 && notes.length < 20) {
    notes.push({
      x: W / 2 + (Math.random() - 0.5) * 100,
      y: H / 2 + 80,
      vx: (Math.random() - 0.5) * 3,
      vy: -1.5 - Math.random() * 2,
      life: 1,
      char: ['♪', '♫', '♬', '♩', '♥', '★'][Math.floor(Math.random() * 6)],
      size: 14 + Math.random() * 16,
      color: palettes[2][Math.floor(Math.random() * palettes[2].length)]
    });
  }
}

// Ring of orbiting text
let ringParticles = [];
function initRing() {
  for (let i = 0; i < 80; i++) {
    ringParticles.push(new TextParticle(
      W / 2, H / 2, W / 2, H / 2,
      charArr[Math.floor(Math.random() * charArr.length)],
      palettes[0][Math.floor(Math.random() * palettes[0].length)],
      10 + Math.random() * 6
    ));
  }
}
initRing();

function drawRing(t) {
  const ringR = 220 + Math.sin(t) * 20;
  for (let i = 0; i < ringParticles.length; i++) {
    const angle = (i / ringParticles.length) * Math.PI * 2 + t * 0.3;
    const r = ringR + Math.sin(angle * 3 + t * 2) * 15;
    const p = ringParticles[i];
    p.targetX = W / 2 + Math.cos(angle) * r;
    p.targetY = H / 2 + Math.sin(angle) * r;
    if (Math.random() < 0.003) {
      p.char = charArr[Math.floor(Math.random() * charArr.length)];
    }
    p.update(t);
    p.draw(ctx, t);
  }
}

// Background gradient + glow
function drawBackground(t) {
  // Dark gradient
  const grad = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, 450);
  grad.addColorStop(0, '#1a0a2e');
  grad.addColorStop(0.5, '#0d0d2b');
  grad.addColorStop(1, '#050510');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Pulsing glow behind figure
  const glowR = 150 + Math.sin(t * 2) * 30;
  const glow = ctx.createRadialGradient(W/2, H/2 - 40, 0, W/2, H/2 - 40, glowR);
  glow.addColorStop(0, 'rgba(196, 77, 255, 0.15)');
  glow.addColorStop(0.5, 'rgba(255, 107, 157, 0.08)');
  glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
}

// Main loop
function animate() {
  time += 0.016;
  const t = time;

  drawBackground(t);

  // Background flowing text
  for (const p of bgParticles) {
    // Drift slowly
    p.targetX += Math.sin(t + p.phase) * 0.2;
    p.targetY += Math.cos(t * 0.7 + p.phase) * 0.15;
    // Wrap
    if (p.targetX < -20) p.targetX = W + 20;
    if (p.targetX > W + 20) p.targetX = -20;
    if (p.targetY < -20) p.targetY = H + 20;
    if (p.targetY > H + 20) p.targetY = -20;
    if (Math.random() < 0.002) {
      p.char = charArr[Math.floor(Math.random() * charArr.length)];
    }
    p.update(t);
    ctx.globalAlpha = 0.12 + 0.08 * Math.sin(t + p.phase);
    p.draw(ctx, t);
  }
  ctx.globalAlpha = 1;

  // Orbiting ring
  drawRing(t);

  // Dancing figure particles
  updateFigureParticles(t);
  for (const p of figureParticles) {
    p.draw(ctx, t);
  }

  // Musical notes
  spawnNote(t);
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i];
    n.x += n.vx;
    n.y += n.vy;
    n.vx += Math.sin(t * 3 + i) * 0.05;
    n.life -= 0.008;
    if (n.life <= 0) { notes.splice(i, 1); continue; }
    ctx.globalAlpha = n.life;
    ctx.fillStyle = n.color;
    ctx.font = `bold ${n.size}px serif`;
    ctx.textAlign = 'center';
    ctx.fillText(n.char, n.x, n.y);
  }
  ctx.globalAlpha = 1;

  // Title text that pulses
  ctx.fillStyle = '#ff6b9d';
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'center';
  const titleAlpha = 0.6 + 0.4 * Math.sin(t * 2);
  ctx.globalAlpha = titleAlpha;
  ctx.fillText('♪  DANCE IN TEXT  ♪', W / 2, 40);
  ctx.globalAlpha = 1;

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
